<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanProbe · CAN 总线回放与信号分析</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">CanProbe <span class="brand-sub">CAN 总线回放与信号分析</span></div>
    <div class="status" id="status">未加载数据</div>
    <div class="actions">
      <button id="btnSample" class="btn btn-accent">加载示例</button>
      <label class="btn filebtn">加载 DBC<input type="file" id="fileDbc" accept=".dbc" hidden /></label>
      <label class="btn filebtn">加载日志<input type="file" id="fileLog" accept=".asc,.csv,.json,.trc,.blf,.mf4,.log" hidden /></label>
      <label class="btn filebtn">加载功能规格<input type="file" id="fileSpec" accept=".yaml,.yml,.json" hidden /></label>
      <button id="btnSpec" class="btn" title="在线编辑功能分析规格">编辑规格</button>
      <button id="btnDiag" class="btn" title="CAN 通信层诊断">通信诊断</button>
    </div>
  </header>

  <div id="mismatch" class="mismatch hidden"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel" id="funcPanel">
        <button id="funcToggle" class="panel-title paneltoggle" type="button"
                aria-expanded="true" aria-controls="functionButtons" title="展开 / 折叠功能列表">
          <span class="caret" aria-hidden="true">▾</span>
          <span>功能</span>
          <span id="funcCount" class="muted"></span>
          <span id="funcMsg" class="fmsg"></span>
        </button>
        <div id="functionButtons" class="funcbtns"></div>
      </div>
      <div class="panel grow">
        <div class="panel-title">信号 <span id="signalCount" class="muted"></span></div>
        <div class="addsig">
          <input id="signalAdd" class="search" list="signalList" placeholder="输入信号名添加…" autocomplete="off" />
          <datalist id="signalList"></datalist>
          <button id="btnAddSignal" class="btn">添加</button>
        </div>
        <input id="signalSearch" class="search" placeholder="搜索信号 / 报文…" />
        <div id="signalTree" class="tree"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <button id="btnPrev" class="tb" title="上一帧">⏮</button>
        <button id="btnPlay" class="tb play" title="播放/暂停">▶</button>
        <button id="btnNext" class="tb" title="下一帧">⏭</button>
        <span id="timeLabel" class="time">0.000 s</span>
        <input type="range" id="seek" min="0" max="1000" value="0" class="seek" />
        <select id="speed" class="speed" title="回放速度">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
          <option value="25">25×</option>
        </select>
        <span id="rangeLabel" class="muted"></span>

        <div class="zoomgrp" title="X 轴（时间）缩放，以光标为中心">
          <span class="zlabel">X</span>
          <button id="btnXOut" class="tb zb" title="时间轴放大范围（看得更宽）">−</button>
          <button id="btnXIn" class="tb zb" title="时间轴缩小范围（看得更细）">+</button>
        </div>
        <div class="zoomgrp" title="Y 轴整体缩放：所有信号条带一起变高 / 变矮">
          <span class="zlabel">Y</span>
          <button id="btnYOut" class="tb zb" title="纵向压缩">−</button>
          <button id="btnYIn" class="tb zb" title="纵向拉伸">+</button>
        </div>
        <button id="btnZoomReset" class="tb" title="复位 X / Y 缩放">复位</button>
      </div>

      <div id="evRibbon" class="ev-ribbon" title="关键事件时间轴（与下方图表 X 轴对齐，点击刻度跳转）">
        <div id="evRibbonTrack" class="ev-ribbon-track"></div>
      </div>

      <div class="charts-scroll">
        <div id="chartWrap" class="chart-wrap">
          <div id="chart" class="chart"></div>
          <!-- 光标线走 DOM 叠加层而不是每条曲线一根 markLine：回放时光标每帧都要
               动，用 setOption 挪 markLine 等于每帧重算整张图的 option -->
          <div id="cursorLine" class="cursor-line hidden"></div>
        </div>
      </div>

      <div class="events">
        <div class="ev-head">
          <div class="panel-title">关键事件 <span id="evCount" class="muted"></span></div>
          <div class="ev-tools">
            <div class="ev-types" id="evTypes">
              <button class="evtype on" data-type="enter" title="功能进入">▲ 进入</button>
              <button class="evtype on" data-type="exit" title="功能退出">▼ 退出</button>
              <button class="evtype on" data-type="change" title="状态迁移（Python 功能的非进出跳变）">◆ 变化</button>
            </div>
            <input id="evSearch" class="ev-search" placeholder="搜索功能 / 原因…" autocomplete="off" />
            <button id="evFollow" class="evbtn on" title="回放 / 拖动光标时自动高亮当前所处的事件">跟随光标</button>
            <button id="evFast" class="evbtn" title="快速求值：只在功能引用的信号真正变化的时刻求值，几百万帧的日志能快十几倍。&#10;对纯电平 / 边沿逻辑结果一致；规格里按 tick 计数或依赖固定步长的 Python code 可能给出不同结果。&#10;默认关闭 = 逐时间戳精确求值。">快速求值</button>
            <button id="evPrev" class="evbtn" title="上一个事件（快捷键 , ）">◀</button>
            <button id="evNext" class="evbtn" title="下一个事件（快捷键 . ）">▶</button>
          </div>
        </div>
        <div id="evFuncs" class="ev-funcs"></div>
        <div id="evList" class="ev-list"></div>
      </div>
    </main>

    <div id="vresizer" class="vresizer" title="拖拽调整宽度（双击复位）"></div>

    <aside id="valuePanel" class="valuepanel">
      <div class="vp-head">
        <div class="panel-title">信号值 <span id="valueTime" class="muted"></span></div>
        <div class="vtoggle">
          <button id="vmAll" class="vmode">全部</button>
          <button id="vmSel" class="vmode on">已勾选</button>
        </div>
      </div>
      <div id="valueList" class="valuelist"></div>
    </aside>
  </div>

  <div id="dropzone" class="dropzone hidden">
    <div class="dropzone-inner">拖拽 DBC / 日志 / 规格文件到此处加载</div>
  </div>

  <div id="specModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span>功能分析规格（YAML）</span>
        <button id="specClose" class="btn">×</button>
      </div>
      <textarea id="specText" spellcheck="false"></textarea>
      <div class="modal-foot">
        <span id="specMsg" class="muted"></span>
        <button id="specRun" class="btn btn-accent">保存并运行分析</button>
      </div>
    </div>
  </div>

  <div id="diagModal" class="modal hidden">
    <div class="modal-box modal-box-wide">
      <div class="modal-head">
        <span>通信诊断</span>
        <div class="diag-head-actions">
          <a id="diagExport" class="btn" href="/api/diag/export?fmt=md" download="diagnosis-report.md">导出 Markdown</a>
          <button id="diagClose" class="btn">×</button>
        </div>
      </div>
      <div class="diag-message-search">
        <input id="diagMsgInput" list="diagMessageList" placeholder="报文 ID 或名称，如 0x270" autocomplete="off" />
        <datalist id="diagMessageList"></datalist>
        <button id="diagMsgLocate" class="btn btn-accent">定位报文</button>
      </div>
      <div id="diagBody" class="diag-body"></div>
    </div>
  </div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
