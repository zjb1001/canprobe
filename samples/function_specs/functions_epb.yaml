# =============================================================================
# EPB 电子驻车制动 —— 夹紧 / 释放(含DAR) / 故障与反馈一致性 全链路功能规格
#
# 适用 DBC : samples/03_CCAN_EP_v2.1.0_20260417-MOD.dbc  (WCBS EBS 系统)
# 业务逻辑参考 flavor: VINFAST/VN1（安全屏障阈值/DAR 判据为该 flavor 的架构分析
#   结论，非 VINFAST 车型需复核；本文件的状态机只依赖下方列出的可观测总线信号）
#
# -----------------------------------------------------------------------------
# 产出方式：dualdesign（多模型对抗式方案设计）
#   Draft A = Claude Opus 4.8 独立起草，Draft B = GPT-5.6 Sol 独立起草，
#   互评 1 轮后由编排器核对 DBC 原始 VAL_ 表逐条验证双方引用的信号枚举，
#   发现两版草稿与两版评审都有基于"猜测枚举"的错误，本文件是修正后的终稿。
#   完整迭代记录见 Parse/EPB_CanprobeSpec_VINFAST_VN1_DualModelDesign_Parse.md
#
# -----------------------------------------------------------------------------
# 关键 DBC 事实核查（评审阶段发现两版草稿都有猜测性假设，以下是逐条核实结论）
# -----------------------------------------------------------------------------
#   * ESC_VehicleStandstill      VAL_ 525: 0 "NO_VEHICLE_STANDSTILL" 1 "VEHICLE_STANDSTILL"
#     （字符串枚举，两版草稿的猜测方向都对，但评审阶段两个模型都误判成"无枚举/纯数值"
#      并列为 Must-Fix——这是本次 dualdesign 里被识别出的"评审幻觉"，已用 DBC 原文纠正）
#   * WCBS_ADCU_VAP_VehicleStandstill VAL_ 644: 0 "Moving" 1 "Standstill"（字符串枚举，
#     两版草稿都误写成 ==1 数值比较，已修正为字符串比较）
#   * EPB_Swch_Mafnc             VAL_ 560: 0 "No Error" 1 "Error"（字符串枚举，
#     两版草稿都误写成 =="1"/=="1.0"/==1 数值比较，已修正）
#   * M2SApplyReleaseRequest     VAL_ 566: 0 "No request" 1 "Request"（只是"有无请求"，
#     **不含方向**；两版草稿都臆测其值里包含"Apply"/"Release"字样做方向判断，
#     该假设在 DBC 层面不成立，已删除，改为方向由开关边沿/当前 EPB_Sts 推断）
#   * EPB_Sts                    VAL_ 560: 0 Unknown/1 Released/2 Locked/3 Releasing/
#     4 Locking/7 Invalid（字符串枚举，与两版草稿假设一致，直接使用）
#   * WCBS_ADCU_VAP_EPBState     VAL_ 644: 0 Released/1 Applied/2 Releasing/3 Applying
#   * CVC_EPB_SwitchSta          VAL_ 217: 0 Not Pressed/1 Pressed/2 Reserved/3 Invalid
#     —— 单一点动开关，无独立 Apply/Release 两路信号，方向靠"当前 EPB 终态"消歧
#     （已锁→按下视为 Release 意图；已释放→按下视为 Apply 意图，属工程假设，非总线直证）
#   * EPB_SysDspMsgReq   VAL_ 560: 0 Off/1 BrakeForceNotEnough/2 ParkBrkOverheat/
#     3 ParkOnTooHighSlope/4 DAR_Nok_DoorOpen/5-7 Reserved
#   * CVC_ACTGear        VAL_ 217: 0 P/1 R/2 N/3 D/4-6 Reserved/7 Fault
#   * WCBS_MainCylinderPressValid / WCBS_BrkPedalValid: 0 Valid/1 Invalid
#
# -----------------------------------------------------------------------------
# 术语与措辞纪律（评审共识：REJECT 不可冒充确定结论）
# -----------------------------------------------------------------------------
#   安全屏障内部变量（SSL_enable_apply_line / DriverState / VehicleState）不在
#   CAN 总线上。本规格任何"被阻止"的判断都只是据可观测信号的【推断】，状态命名
#   统一带 SUSPECTED_ 前缀，reason() 文本里显式写"推断，非总线直接证据"。
#   请求发出后既无 DspMsg 也无法用可观测信号解释仍未执行的，归类
#   NO_VISIBLE_CAUSE（不臆测是执行层还是内部拒绝）。
#
# 五个 function：
#   epb_apply    夹紧全链路（请求 → 判决 → Locking → Locked，含"为什么没夹紧"）
#   epb_release  释放全链路，含 DAR 自动释放候选路径
#   epb_transition_integrity  独立检查无前置可见请求的状态迁移与未完成反向迁移
#   brake_pressure_response   独立检查踏板输入与主缸压力响应一致性
#   epb_health   故障位 / 开关健康度 / 双反馈(EPB_Sts vs ADCU_VAP_EPBState)一致性
#                （独立处境，排查也可以先看这条）
#
# 约定：
#   * VAL_ 枚举在 canprobe 中解码为字符串名，比较值一律写字符串。
#   * 点动开关在双发送者场景下会抖动，请求边沿需去抖（候选值持续 ≥ HOLD 才确认）。
#   * signals 段按 请求→反馈→上下文 顺序，点功能按钮整组进 Graphics。
# =============================================================================

functions:

  # ===========================================================================
  # EPB 夹紧 (Apply) 全链路
  # ===========================================================================
  - id: epb_apply
    name: "EPB 夹紧 Apply (全链路)"
    description: >-
      驾驶员按 P 键（当前处于 Released/Unknown 时视为 Apply 意图）或 M2S 请求
      镜像变化 → EPB_Sts: Unknown/Released→Locking→Locked。请求发出后若未见
      Locking：优先看 EPB_SysDspMsgReq（总线直接证据）；否则用 ESC_VehicleStandstill
      / WCBS_ADCU_VAP_VehicleStandstill 推断车辆是否静止（Apply 安全前提的
      近似，非直接证据）；两者都不成立则归 NO_VISIBLE_CAUSE，不臆测根因。
    signals:
      - CVC_EPB_SwitchSta              # 请求：驾驶员 P 键
      - M2SApplyReleaseRequest         # 请求：MOD→ACT 内部请求镜像（仅"有无请求"，无方向）
      - EPB_Sts                        # 反馈：EPB 总状态
      - WCBS_ADCU_VAP_EPBState         # 反馈：ADCU 侧同一物理状态（交叉验证）
      - EPB_SysDspMsgReq               # 反馈：仪表消息（被阻止原因的直接文本）
      - EPB_SysWrnIndReq
      - EPB_SysStatIndReq
      - ESC_VehicleStandstill          # 上下文：静止（Apply 前提，推断用，冗余腿1）
      - WCBS_ADCU_VAP_VehicleStandstill # 上下文：静止（推断用，冗余腿2，ADCU侧）
      - WCBS_MainCylinderPress
      - CVC_ACTGear
      - WCBS_EPB_Fault                 # 上下文：故障总位（不在此短路，仅标注见 epb_health）
      - EPB_Swch_Mafnc
      - EPB_CDPActive
    code: |
      ACTIVE_STATES = ["APPLY_REQUESTED", "APPLYING",
                        "APPLY_SUSPECTED_BLOCKED", "APPLY_NO_VISIBLE_CAUSE",
                        "APPLY_FEEDBACK_UNKNOWN"]
      INITIAL = "IDLE"

      SW_CANDIDATE_HOLD = 0.20   # s，开关候选值需持续这么久才确认为稳定按压（滤抖动）
      REARM              = 0.30  # s，两次确认按压之间的最小间隔（防止刷屏式重触发）
      RESP_TMO           = 0.60  # s，请求确认后，EPB_Sts 应在此内进入 Locking
      NO_CAUSE_TMO       = 1.50  # s，既无 DspMsg 也无静止推断依据仍未动作 → 判 NO_VISIBLE_CAUSE
      COMPLETE_TMO       = 5.0   # s，Locking 后应在此内到 Locked，否则单独提示

      # -- 开关去抖：candidate/stable 两级，避免把双发送者 ~100ms 抖动当成按压 --
      sw_cand = None; sw_cand_t = None; sw_stable = None
      last_confirmed_press = None

      # -- 事务：request_t 一旦置位就必须走到 Locking/终止才清空，
      #    不与"当前 EPB_Sts 是否已经是 Locked"耦合（避免吞掉新请求） --
      request_t = None
      apply_seen_t = None       # 观测到 Locking 的时刻
      reported_blocked = False
      reported_noact = False
      reported_complete_tmo = False

      def is_standstill(std_signal, std_moving_str, std_still_str, raw):
          if raw is None:
              return None
          if raw == std_still_str:
              return True
          if raw == std_moving_str:
              return False
          return None

      def standstill_evidence(s):
          # 冗余两腿：ESC 侧优先，ADCU 侧兜底；不一致时仍以"任一腿=静止"放宽判定，
          # 因为这里只是"是否有静止证据"，不是精确一致性检查（一致性见 epb_health）
          esc = is_standstill(None, "NO_VEHICLE_STANDSTILL", "VEHICLE_STANDSTILL",
                               s.ESC_VehicleStandstill)
          adcu = is_standstill(None, "Moving", "Standstill",
                                s.WCBS_ADCU_VAP_VehicleStandstill)
          if esc is True or adcu is True:
              return True
          if esc is False and adcu is False:
              return False
          return None   # 只有一腿或双腿缺失/矛盾 → 无法判定

      def update(t, s, dt):
          global sw_cand, sw_cand_t, sw_stable, last_confirmed_press
          global request_t, apply_seen_t
          global reported_blocked, reported_noact, reported_complete_tmo

          sts = s.EPB_Sts
          if sts is None:
              return None
          if sts == "Invalid":
              reason("EPB_Sts=Invalid：反馈本身不可信，暂不做 Apply 判决")
              return "APPLY_FEEDBACK_UNKNOWN"

          # --- 开关去抖：candidate 变化就重新计时，稳定 SW_CANDIDATE_HOLD 才确认 ---
          sw = s.CVC_EPB_SwitchSta
          if sw != sw_cand:
              sw_cand = sw; sw_cand_t = t
          confirmed_press = False
          if (sw_cand != sw_stable and sw_cand_t is not None
                  and (t - sw_cand_t) >= SW_CANDIDATE_HOLD):
              old = sw_stable
              sw_stable = sw_cand
              if (sw_stable == "Pressed" and old != "Pressed"
                      and (last_confirmed_press is None
                           or (t - last_confirmed_press) >= REARM)):
                  confirmed_press = True
                  last_confirmed_press = t

          # 方向消歧：按压时若当前反馈已在 Locked/Locking，这次按压属于 Release 语义，
          # 交给 epb_release 处理，这里不当作 Apply 请求（工程假设：单键切换式开关）
          sw_is_apply_intent = confirmed_press and sts in ("Released", "Unknown")

          m2s_req_edge = (s.changed("M2SApplyReleaseRequest")
                           and s.M2SApplyReleaseRequest == "Request")
          # M2S 无方向信息，仅当当前终态为 Released/Unknown 时才归为 Apply 请求的辅证
          m2s_is_apply_intent = m2s_req_edge and sts in ("Released", "Unknown")

          # --- 请求检测：与"当前终态判读"解耦，任何时刻都先看是否有新请求 ---
          if (sw_is_apply_intent or m2s_is_apply_intent) and request_t is None:
              request_t = t
              apply_seen_t = None
              reported_blocked = False; reported_noact = False
              reported_complete_tmo = False
              reason("检出 Apply 请求（来源=%s）：P键=%s、M2S=%s、EPB_Sts=%s、"
                     "静止证据=%s、挡位=%s —— 等待判决"
                     % ("SWITCH" if sw_is_apply_intent else "M2S",
                        s.CVC_EPB_SwitchSta, s.M2SApplyReleaseRequest, sts,
                        standstill_evidence(s), s.CVC_ACTGear))
              return "APPLY_REQUESTED"

          # --- 执行中 ---
          if sts == "Locking":
              if apply_seen_t is None:
                  apply_seen_t = t
                  reason("EPB_Sts 进入 Locking（%s）：静止证据=%s、主缸 %s bar"
                         % ("请求后 %.2fs" % (t - request_t) if request_t else "无前置请求观测",
                            standstill_evidence(s), s.WCBS_MainCylinderPress))
              elif (t - apply_seen_t) >= COMPLETE_TMO and not reported_complete_tmo:
                  reported_complete_tmo = True
                  attempt("EPB_Sts 已 Locking %.1fs 仍未到 Locked" % (t - apply_seen_t))
                  reason("Locking 持续过久：%.1fs 未见 Locked，ADCU 侧=%s，故障位=%s"
                         % (t - apply_seen_t, s.WCBS_ADCU_VAP_EPBState, s.WCBS_EPB_Fault))
              return "APPLYING"

          # --- 完成 ---
          if sts == "Locked":
              if request_t is not None or apply_seen_t is not None:
                  adcu = s.WCBS_ADCU_VAP_EPBState
                  note = "" if adcu in (None, "Applied") else "（ADCU 侧=%s 不一致，见 epb_health）" % adcu
                  reason("EPB 已 Locked（夹紧完成）%s" % note)
              request_t = None; apply_seen_t = None
              reported_blocked = False; reported_noact = False; reported_complete_tmo = False
              return None   # 完成态不计为"需要关注"，交给 epb_health 做双反馈核对

          # --- 请求已发出但未见 Locking：分级判定，不下确定结论 ---
          if request_t is not None and sts in ("Released", "Unknown"):
              wait = t - request_t
              if wait < RESP_TMO:
                  return None
              dsp = s.EPB_SysDspMsgReq
              if dsp not in (None, "Off"):
                  if not reported_blocked:
                      reported_blocked = True
                      attempt("Apply 请求后 %.2fs 未见 Locking，仪表消息=%s" % (wait, dsp))
                      reason("Apply 疑似被阻止（总线直接证据）：EPB_SysDspMsgReq=%s，"
                             "EPB_Sts 停留在 %s" % (dsp, sts))
                  return "APPLY_SUSPECTED_BLOCKED"

              ss = standstill_evidence(s)
              if ss is False:
                  if not reported_blocked:
                      reported_blocked = True
                      attempt("Apply 请求后 %.2fs 未见 Locking，静止证据=非静止" % wait)
                      reason("Apply 疑似被阻止（推断，非总线直接证据）：ESC_VehicleStandstill=%s、"
                             "WCBS_ADCU_VAP_VehicleStandstill=%s 显示车辆非静止；安全屏障要求"
                             "STATIONARY，内部 VehicleState 不在总线上，此处仅为据可观测信号的推断"
                             % (s.ESC_VehicleStandstill, s.WCBS_ADCU_VAP_VehicleStandstill))
                  return "APPLY_SUSPECTED_BLOCKED"

              if wait >= NO_CAUSE_TMO and not reported_noact:
                  reported_noact = True
                  attempt("Apply 请求后 %.2fs：无 DspMsg、静止证据=%s（无法判定非静止），仍 %s"
                          % (wait, ss, sts))
                  reason("Apply 请求后 %.2fs 未见 Locking，且总线上找不到可解释的阻止证据"
                         "（无仪表消息、静止证据不支持'被拒绝'这一推断）：疑执行层或总线不可见"
                         "的内部判决，不臆测具体根因，需台架/内部日志进一步确认" % wait)
                  return "APPLY_NO_VISIBLE_CAUSE"
              return None

          return None

  # ===========================================================================
  # EPB 释放 (Release) 全链路，含 DAR 自动释放候选路径
  # ===========================================================================
  - id: epb_release
    name: "EPB 释放 Release (全链路, 含 DAR)"
    description: >-
      三种触发源：手动 P 键（当前处于 Locked 时视为 Release 意图）/ DAR 候选
      （挡位稳定切入 D/R 且有制动介入证据，只是"候选条件"，不代表 ECU 已发出
      内部 DAR 请求）/ M2S 请求镜像（无方向，需当前终态为 Locked 才归为 Release
      辅证）。EPB_Sts: Locked→Releasing→Released。请求后未释放时，优先用
            EPB_SysDspMsgReq（如 DAR_Nok_DoorOpen）；否则用 点火 ON 且有效主缸压力
            推断"驾驶员是否在场"（DriverPresent 的近似，非直接证据）。踏板开度只作
            上下文，不替代液压介入证据；踏板/压力一致性由独立功能检查。
    signals:
      - CVC_EPB_SwitchSta              # 请求：驾驶员 P 键
      - CVC_ACTGear                     # 请求：DAR 候选（切 D/R）
      - M2SApplyReleaseRequest         # 请求：MOD→ACT 内部请求镜像（无方向）
      - EPB_Sts                        # 反馈：EPB 总状态
      - WCBS_ADCU_VAP_EPBState         # 反馈：ADCU 侧（交叉验证）
      - EPB_SysDspMsgReq               # 反馈：仪表消息（DAR_Nok_DoorOpen 等）
      - EPB_SysWrnIndReq
      - BMS_IGN_Sts                    # 上下文：点火（DriverPresent 前提之一，推断用）
      - WCBS_MainCylinderPress         # 上下文：主缸压力（推断驾驶员在踩制动）
      - WCBS_MainCylinderPressValid
      - WCBS_BrkPedalPct               # 上下文：踏板开度（辅助推断制动介入）
      - WCBS_BrkPedalValid
            - WCBS_VehicleSpeed
            - WCBS_VehicleSpeedValid
      - WCBS_EPB_Fault
      - EPB_Swch_Mafnc
    code: |
      ACTIVE_STATES = ["RELEASE_REQUESTED", "DAR_CANDIDATE", "RELEASING",
                        "RELEASE_SUSPECTED_BLOCKED", "RELEASE_NO_VISIBLE_CAUSE",
                        "RELEASE_FEEDBACK_UNKNOWN"]
      INITIAL = "IDLE"

      SW_CANDIDATE_HOLD = 0.20
      GEAR_CANDIDATE_HOLD = 0.20
      REARM        = 0.30
      RESP_TMO     = 0.60
      NO_CAUSE_TMO = 1.50
      COMPLETE_TMO = 5.0
      PRESS_ON     = 3.0   # bar，主缸压力判"驾驶员在踩制动"门限（工程近似，非精确算法）

      sw_cand = None; sw_cand_t = None; sw_stable = None
      gear_cand = None; gear_cand_t = None; gear_stable = None
      last_confirmed_press = None

      request_t = None
      request_source = None     # "SWITCH" / "DAR_CANDIDATE" / "M2S"
      releasing_seen_t = None
      reported_blocked = False
      reported_noact = False
      reported_complete_tmo = False

      def brake_intervening(s):
          p = s.WCBS_MainCylinderPress
          if (p is not None and s.WCBS_MainCylinderPressValid in (None, "Valid")
                  and float(p) >= PRESS_ON):
              return True
          return False

      def driver_present_evidence(s):
          ign = s.BMS_IGN_Sts
          if ign is None:
              return None
          if ign != "ON":
              return False
          return brake_intervening(s)

      def update(t, s, dt):
          global sw_cand, sw_cand_t, sw_stable
          global gear_cand, gear_cand_t, gear_stable, last_confirmed_press
          global request_t, request_source, releasing_seen_t
          global reported_blocked, reported_noact, reported_complete_tmo

          sts = s.EPB_Sts
          if sts is None:
              return None
          if sts == "Invalid":
              reason("EPB_Sts=Invalid：反馈本身不可信，暂不做 Release 判决")
              return "RELEASE_FEEDBACK_UNKNOWN"

          # --- P 键去抖，方向消歧：仅当前终态为 Locked/Locking 时按压才算 Release 意图 ---
          sw = s.CVC_EPB_SwitchSta
          if sw != sw_cand:
              sw_cand = sw; sw_cand_t = t
          confirmed_press = False
          if (sw_cand != sw_stable and sw_cand_t is not None
                  and (t - sw_cand_t) >= SW_CANDIDATE_HOLD):
              old = sw_stable
              sw_stable = sw_cand
              if (sw_stable == "Pressed" and old != "Pressed"
                      and (last_confirmed_press is None
                           or (t - last_confirmed_press) >= REARM)):
                  confirmed_press = True
                  last_confirmed_press = t
          sw_is_release_intent = confirmed_press and sts in ("Locked", "Locking")

          # --- 挡位去抖，DAR 候选：稳定切入 D/R 且有制动介入证据 ---
          gear = s.CVC_ACTGear
          if gear != gear_cand:
              gear_cand = gear; gear_cand_t = t
          gear_stable_dr = False
          if (gear_cand != gear_stable and gear_cand_t is not None
                  and (t - gear_cand_t) >= GEAR_CANDIDATE_HOLD):
              gear_stable = gear_cand
          if gear_stable in ("D", "R") and brake_intervening(s):
              gear_stable_dr = True
          speed = s.WCBS_VehicleSpeed
          vehicle_stopped = (speed is not None
                              and s.WCBS_VehicleSpeedValid in (None, "Valid")
                              and float(speed) <= 1.0)
          # DAR 从已夹紧稳态释放。车辆移动或仍在 Locking 时，不把 D/R+踏板
          # 解释成 DAR，避免掩盖异常的动态夹紧状态迁移。
          dar_intent = (gear_stable_dr and sts == "Locked" and vehicle_stopped
                        and brake_intervening(s))

          m2s_req_edge = (s.changed("M2SApplyReleaseRequest")
                           and s.M2SApplyReleaseRequest == "Request")
          m2s_is_release_intent = m2s_req_edge and sts in ("Locked", "Locking")

          if request_t is None:
              src = None
              if sw_is_release_intent:
                  src = "SWITCH"
              elif dar_intent:
                  src = "DAR_CANDIDATE"
              elif m2s_is_release_intent:
                  src = "M2S"
              if src is not None:
                  request_t = t; request_source = src
                  reported_blocked = False; reported_noact = False; reported_complete_tmo = False
                  reason("检出 Release 请求（来源=%s）：P键=%s、挡位=%s(候选=%s)、"
                         "点火=%s、主缸 %s bar、踏板 %s%% —— 等待判决"
                         % (src, s.CVC_EPB_SwitchSta, s.CVC_ACTGear, gear_stable_dr,
                            s.BMS_IGN_Sts, s.WCBS_MainCylinderPress, s.WCBS_BrkPedalPct))
                  return "DAR_CANDIDATE" if src == "DAR_CANDIDATE" else "RELEASE_REQUESTED"

          if sts == "Releasing":
              if releasing_seen_t is None:
                  releasing_seen_t = t
                  reason("EPB_Sts 进入 Releasing（来源=%s）：点火=%s、主缸 %s bar"
                         % (request_source, s.BMS_IGN_Sts, s.WCBS_MainCylinderPress))
              elif (t - releasing_seen_t) >= COMPLETE_TMO and not reported_complete_tmo:
                  reported_complete_tmo = True
                  attempt("EPB_Sts 已 Releasing %.1fs 仍未到 Released" % (t - releasing_seen_t))
                  reason("Releasing 持续过久：%.1fs 未见 Released，ADCU 侧=%s"
                         % (t - releasing_seen_t, s.WCBS_ADCU_VAP_EPBState))
              return "RELEASING"

          if sts == "Released":
              if request_t is not None or releasing_seen_t is not None:
                  adcu = s.WCBS_ADCU_VAP_EPBState
                  note = "" if adcu in (None, "Released") else "（ADCU 侧=%s 不一致，见 epb_health）" % adcu
                  reason("EPB 已 Released（释放完成，来源=%s）%s" % (request_source, note))
              request_t = None; request_source = None; releasing_seen_t = None
              reported_blocked = False; reported_noact = False; reported_complete_tmo = False
              return None

          if request_t is not None and sts in ("Locked", "Locking"):
              wait = t - request_t
              if wait < RESP_TMO:
                  return None
              dsp = s.EPB_SysDspMsgReq
              if dsp not in (None, "Off"):
                  if not reported_blocked:
                      reported_blocked = True
                      attempt("Release 请求(%s)后 %.2fs 未见 Releasing，仪表消息=%s"
                              % (request_source, wait, dsp))
                      reason("Release 疑似被阻止（总线直接证据）：EPB_SysDspMsgReq=%s，"
                             "EPB_Sts 停留在 %s" % (dsp, sts))
                  return "RELEASE_SUSPECTED_BLOCKED"

              dp = driver_present_evidence(s)
              if dp is False:
                  if not reported_blocked:
                      reported_blocked = True
                      attempt("Release 请求(%s)后 %.2fs 未见 Releasing，DriverPresent 证据=否"
                              % (request_source, wait))
                      reason("Release 疑似被阻止（推断，非总线直接证据）：点火=%s、主缸 %s bar"
                             "(valid=%s)、踏板 %s%%，不满足'点火ON 且 制动介入'这一 DriverPresent"
                             "近似判据；内部 DriverState 不在总线上，此处仅为推断"
                             % (s.BMS_IGN_Sts, s.WCBS_MainCylinderPress,
                                s.WCBS_MainCylinderPressValid, s.WCBS_BrkPedalPct))
                  return "RELEASE_SUSPECTED_BLOCKED"

              if wait >= NO_CAUSE_TMO and not reported_noact:
                  reported_noact = True
                  attempt("Release 请求(%s)后 %.2fs：无 DspMsg、DriverPresent 证据=%s（无法判定为否），仍 %s"
                          % (request_source, wait, dp, sts))
                  reason("Release 请求后 %.2fs 未见 Releasing，且总线上找不到可解释的阻止证据："
                         "疑执行层或总线不可见的内部判决，不臆测具体根因，需台架/内部日志进一步确认"
                         % wait)
                  return "RELEASE_NO_VISIBLE_CAUSE"
              return None

          return None

  # ===========================================================================
  # EPB 状态迁移完整性 —— 独立于正常 Apply / Release 事务
  # ===========================================================================
  - id: epb_transition_integrity
    name: "EPB 状态迁移完整性"
    description: >-
      独立检查 EPB_Sts 的状态迁移是否有可见前置请求，以及执行是否到达对应终态。
      Released/Unknown→Locking 前应先看到稳定 P 键 Apply 意图或 M2S Request；
      Locked→Releasing 前应先看到稳定 P 键 Release 意图或 M2S Request。
      另检查 Locking 未到 Locked 即转 Releasing、Releasing 未到 Released 即转
      Locking。M2S 不含方向，仅作为“存在可见请求”的时序证据。CDP、故障位和挡位
      只作为上下文，不据此臆测内部触发源或根因。
    signals:
      - CVC_EPB_SwitchSta
      - M2SApplyReleaseRequest
      - EPB_Sts
      - WCBS_ADCU_VAP_EPBState
      - EPB_CDPActive
      - WCBS_CDPFailSts
      - WCBS_EPB_Fault
      - EPB_Swch_Mafnc
      - CVC_ACTGear
      - WCBS_VehicleSpeed
      - WCBS_VehicleSpeedValid
      - WCBS_BrkPedalPct
      - WCBS_MainCylinderPress
    code: |
      ACTIVE_STATES = ["LOCKING_WITHOUT_VISIBLE_REQUEST",
                        "RELEASING_WITHOUT_VISIBLE_REQUEST",
                        "APPLY_REVERSED_BEFORE_LOCKED",
                        "RELEASE_REVERSED_BEFORE_RELEASED"]
      INITIAL = "OK"

      REQUEST_LOOKBACK = 0.30  # s，可见请求允许早于状态迁移的最大时窗
      SW_HOLD = 0.20           # s，P 键稳定后才作为请求证据

      sw_candidate = None
      sw_candidate_t = None
      sw_stable = None
      last_switch_request_t = None
      last_m2s_request_t = None
      previous_epb_state = None
      locking_started_t = None
      releasing_started_t = None

      def recent_request(t):
          times = [x for x in (last_switch_request_t, last_m2s_request_t)
                   if x is not None]
          return bool(times) and (t - max(times)) <= REQUEST_LOOKBACK

      def context(s):
          return ("P键=%s、M2S=%s、车速=%s km/h、挡位=%s、CDP=%s、"
                  "EPB故障=%s、开关故障=%s、CDP故障=%s"
                  % (s.CVC_EPB_SwitchSta, s.M2SApplyReleaseRequest,
                     s.WCBS_VehicleSpeed, s.CVC_ACTGear, s.EPB_CDPActive,
                     s.WCBS_EPB_Fault, s.EPB_Swch_Mafnc, s.WCBS_CDPFailSts))

      def update(t, s, dt):
          global sw_candidate, sw_candidate_t, sw_stable
          global last_switch_request_t, last_m2s_request_t
          global previous_epb_state, locking_started_t, releasing_started_t

          sts = s.EPB_Sts
          if sts is None or sts == "Invalid":
              return None

          sw = s.CVC_EPB_SwitchSta
          if sw != sw_candidate:
              sw_candidate = sw
              sw_candidate_t = t
          if (sw_candidate != sw_stable and sw_candidate_t is not None
                  and (t - sw_candidate_t) >= SW_HOLD):
              old_stable = sw_stable
              sw_stable = sw_candidate
              if sw_stable == "Pressed" and old_stable != "Pressed":
                  last_switch_request_t = t

          if (s.changed("M2SApplyReleaseRequest")
                  and s.M2SApplyReleaseRequest == "Request"):
              last_m2s_request_t = t

          if previous_epb_state is None:
              previous_epb_state = sts
              return "OK"
          if sts == previous_epb_state:
              return None

          old = previous_epb_state
          previous_epb_state = sts

          if sts == "Locking":
              locking_started_t = t
              if old == "Releasing":
                  duration = (t - releasing_started_t
                              if releasing_started_t is not None else 0.0)
                  reason("EPB Releasing 未到 Released 即反向进入 Locking：持续 %.3fs；%s"
                         % (duration, context(s)))
                  return "RELEASE_REVERSED_BEFORE_RELEASED"
              if old in ("Released", "Unknown") and not recent_request(t):
                  reason("EPB 在无前置可见请求时从 %s 进入 Locking；%s。"
                         "该结论只说明总线未观察到前置请求，不等同于确定的非预期夹紧"
                         % (old, context(s)))
                  return "LOCKING_WITHOUT_VISIBLE_REQUEST"

          if sts == "Releasing":
              releasing_started_t = t
              if old == "Locking":
                  duration = (t - locking_started_t
                              if locking_started_t is not None else 0.0)
                  reason("EPB Locking 未到 Locked 即反向进入 Releasing：持续 %.3fs；%s"
                         % (duration, context(s)))
                  return "APPLY_REVERSED_BEFORE_LOCKED"
              if old == "Locked" and not recent_request(t):
                  reason("EPB 在无前置可见请求时从 Locked 进入 Releasing；%s。"
                         "该结论只说明总线未观察到前置请求" % context(s))
                  return "RELEASING_WITHOUT_VISIBLE_REQUEST"

          if sts in ("Locked", "Released"):
              reason("EPB 状态迁移到终态 %s，迁移完整性恢复" % sts)
              return "OK"
          return None

  # ===========================================================================
  # 制动踏板 / 主缸压力响应 —— 独立于 EPB 状态机
  # ===========================================================================
  - id: brake_pressure_response
    name: "制动踏板 / 主缸压力响应"
    description: >-
      独立检查有效踏板输入与有效主缸压力的响应一致性。深踩踏板后若主缸压力在
      可标定时间内仍低于工程筛查阈值，则报告 SUSPECTED_LOW_PRESSURE_RESPONSE；
      信号无效单独报告 INPUT_INVALID。该功能只定位可疑时间窗，不把压力偏低表述为
      完全无压力，也不直接判定液压硬件根因；阈值需按车型目标压力标定复核。
    signals:
      - WCBS_BrkPedalPct
      - WCBS_BrkPedalTravel
      - WCBS_BrkPedalValid
      - WCBS_MainCylinderPress
      - WCBS_MainCylinderPressValid
      - CVC_StsBrakePedalSwitch
      - WCBS_VehicleSpeed
      - WCBS_VehicleSpeedValid
      - CVC_ACTGear
      - EPB_Sts
      - EPB_CDPActive
    code: |
      ACTIVE_STATES = ["SUSPECTED_LOW_PRESSURE_RESPONSE", "INPUT_INVALID"]
      INITIAL = "OK"

      PEDAL_HIGH = 90.0       # %，深踩踏板筛查阈值
      PEDAL_CLEAR = 80.0      # %，退出滞回
      PRESS_MIN = 20.0        # bar，深踩时最低工程筛查阈值，需按车型标定复核
      RESPONSE_TMO = 0.30     # s，允许液压响应建立的时间

      mismatch_since = None
      max_pedal = None
      min_pressure = None

      def update(t, s, dt):
          global mismatch_since, max_pedal, min_pressure

          pedal = s.WCBS_BrkPedalPct
          pressure = s.WCBS_MainCylinderPress
          if pedal is None or pressure is None:
              mismatch_since = None; max_pedal = None; min_pressure = None
              return "OK"

          if (s.WCBS_BrkPedalValid not in (None, "Valid")
                  or s.WCBS_MainCylinderPressValid not in (None, "Valid")):
              mismatch_since = None; max_pedal = None; min_pressure = None
              reason("制动输入信号无效：PedalValid=%s、PressureValid=%s；不做压力响应判定"
                     % (s.WCBS_BrkPedalValid, s.WCBS_MainCylinderPressValid))
              return "INPUT_INVALID"

          pedal = float(pedal)
          pressure = float(pressure)
          if pedal >= PEDAL_HIGH and pressure < PRESS_MIN:
              if mismatch_since is None:
                  mismatch_since = t
                  max_pedal = pedal
                  min_pressure = pressure
              else:
                  max_pedal = max(max_pedal, pedal)
                  min_pressure = min(min_pressure, pressure)
              if (t - mismatch_since) >= RESPONSE_TMO:
                  reason("深踩踏板后压力响应疑似偏低，持续 %.2fs：踏板最高 %.1f%%、"
                         "主缸压力最低 %.2f bar（筛查阈值 %.1f bar）、车速=%s km/h、"
                         "挡位=%s、EPB=%s、CDP=%s；需结合目标压力、轮缸压力、"
                         "减速度和液压检查确认根因"
                         % (t - mismatch_since, max_pedal, min_pressure, PRESS_MIN,
                            s.WCBS_VehicleSpeed, s.CVC_ACTGear,
                            s.EPB_Sts, s.EPB_CDPActive))
                  return "SUSPECTED_LOW_PRESSURE_RESPONSE"
              return None

          if pedal < PEDAL_CLEAR or pressure >= PRESS_MIN:
              had_mismatch = mismatch_since is not None
              mismatch_since = None; max_pedal = None; min_pressure = None
              if had_mismatch:
                  reason("踏板/压力响应筛查条件解除：踏板=%.1f%%、主缸压力=%.2f bar"
                         % (pedal, pressure))
              return "OK"
          return None

  # ===========================================================================
  # EPB 故障 / 开关健康度 / 双反馈一致性 —— 独立处境，排查也可先看这条
  # ===========================================================================
  - id: epb_health
    name: "EPB 故障 / 开关健康度 / 反馈一致性"
    description: >-
      与某一次 Apply/Release 请求无关的独立处境：①WCBS_EPB_Fault / EPB_Swch_Mafnc
      故障位；②EPB_SysDspMsgReq 非 Off 的仪表告警文本；③EPB_Sts 与
      WCBS_ADCU_VAP_EPBState 两份反馈的稳态映射一致性（Released/Locked/
      Releasing/Locking 对 Released/Applied/Releasing/Applying，允许短暂
      传播延迟，不做逐帧比较）；④P 键高频抖动作为双发送者旁证。
    signals:
      - WCBS_EPB_Fault
      - EPB_Swch_Mafnc
      - EPB_SysDspMsgReq
      - EPB_SysWrnIndReq
      - EPB_SysStatIndReq
      - EPB_Sts
      - WCBS_ADCU_VAP_EPBState
      - CVC_EPB_SwitchSta
      - EPB_CDPActive
    code: |
      ACTIVE_STATES = ["FAULT", "WARNING", "STATE_MISMATCH", "SW_JITTER"]
      INITIAL = "OK"

      MISMATCH_HOLD = 1.0   # s，两份反馈不一致须持续这么久才报（滤过渡态错拍）
      JITTER_WIN    = 1.0   # s
      JITTER_MIN    = 6     # 该窗口内边沿次数达到才判抖动

      # EPB_Sts -> 期望的 WCBS_ADCU_VAP_EPBState（终态之间的映射，过渡态不做强校验）
      EXPECT = {"Released": "Released", "Locked": "Applied",
                "Releasing": "Releasing", "Locking": "Applying"}

      mismatch_since = None
      mismatch_reported = False
      edge_hist = []     # 最近若干次 CVC_EPB_SwitchSta 边沿时间戳
      prev_sw = None
      jitter_reported_until = 0.0

      def update(t, s, dt):
          global mismatch_since, mismatch_reported
          global edge_hist, prev_sw, jitter_reported_until

          # --- 故障优先（正交事件，不覆盖下面的一致性/抖动检查，只是优先返回态）---
          if s.WCBS_EPB_Fault == "Error" or s.EPB_Swch_Mafnc == "Error":
              reason("EPB 故障：WCBS_EPB_Fault=%s、EPB_Swch_Mafnc=%s、EPB_Sts=%s、DspMsg=%s"
                     % (s.WCBS_EPB_Fault, s.EPB_Swch_Mafnc, s.EPB_Sts, s.EPB_SysDspMsgReq))
              return "FAULT"

          dsp = s.EPB_SysDspMsgReq
          if dsp not in (None, "Off") and s.changed("EPB_SysDspMsgReq"):
              reason("EPB 仪表告警：EPB_SysDspMsgReq=%s（WrnInd=%s, StatInd=%s）"
                     % (dsp, s.EPB_SysWrnIndReq, s.EPB_SysStatIndReq))
              return "WARNING"

          # --- 双反馈一致性（终态间比较，过渡态双方都在变化时跳过） ---
          sts = s.EPB_Sts
          adcu = s.WCBS_ADCU_VAP_EPBState
          if sts in EXPECT and adcu is not None:
              ok = (adcu == EXPECT[sts])
              if not ok:
                  if mismatch_since is None:
                      mismatch_since = t
                  elif (t - mismatch_since) >= MISMATCH_HOLD and not mismatch_reported:
                      mismatch_reported = True
                      reason("双反馈不一致持续 ≥%.1fs：EPB_Sts=%s（期望 ADCU=%s），"
                             "实际 WCBS_ADCU_VAP_EPBState=%s —— 疑映射错误或报文丢失"
                             % (MISMATCH_HOLD, sts, EXPECT[sts], adcu))
                      return "STATE_MISMATCH"
              else:
                  mismatch_since = None
                  mismatch_reported = False

          # --- P 键抖动旁证（双发送者场景，类比 EP35 carmode_bus） ---
          sw = s.CVC_EPB_SwitchSta
          if sw != prev_sw:
              edge_hist.append(t)
              edge_hist[:] = [x for x in edge_hist if t - x <= JITTER_WIN]
              prev_sw = sw
              if len(edge_hist) >= JITTER_MIN and t >= jitter_reported_until:
                  jitter_reported_until = t + JITTER_WIN
                  attempt("CVC_EPB_SwitchSta 在 %.1fs 内边沿 %d 次" % (JITTER_WIN, len(edge_hist)))
                  reason("检出 P 键高频抖动：%.1fs 内 %d 次翻转，疑同一 CAN ID 多发送者/机械抖动，"
                         "Apply/Release 判决已做去抖，此处仅作旁证" % (JITTER_WIN, len(edge_hist)))
                  return "SW_JITTER"

          if mismatch_since is None and (dsp in (None, "Off")):
              return "OK"
          return None

  # ===========================================================================
  # EPB / AVH 坡度接管边界
  # ===========================================================================
  - id: epb_avh_takeover_boundary
    name: "EPB 接管 AVH 坡度边界"
    description: >-
      检查 AVH Active 期间 EPB 从 Released 进入 Locking/Locked 的接管边沿。
      ESC_SlopeGrade 绝对值稳定至少 0.5s 后才参与判定：低于 25% 的接管标记为
      BELOW_THRESHOLD（重点覆盖 22~23% 偶发现象）；达到或超过 25% 记为
      EXPECTED_THRESHOLD。坡度缺失或尚未稳定时只记录证据不足，不臆测阈值违规。
    signals:
      - WCBS_AVH_Status               # 被接管功能状态
      - EPB_Sts                       # EPB 接管反馈
      - ESC_SlopeGrade                # 上下坡百分比，判定取绝对值
      - ESC_VehicleStandstill
      - WCBS_VehicleSpeed
      - WCBS_MainCylinderPress
      - WCBS_MainCylinderPressValid
    code: |
      ACTIVE_STATES = ["BELOW_THRESHOLD", "SLOPE_NOT_STABLE"]
      INITIAL = "MONITORING"

      TAKEOVER_SLOPE = 25.0   # %，需求定义的 EPB 接管 AVH 最小绝对坡度
      SLOPE_HOLD = 0.5        # s，过滤坡度信号瞬时跳变和边界抖动

      slope_candidate = None
      slope_candidate_t = None
      stable_slope = None

      def update(t, s, dt):
          global slope_candidate, slope_candidate_t, stable_slope

          raw_slope = s.ESC_SlopeGrade
          if raw_slope is None:
              slope_candidate = None
              slope_candidate_t = None
              stable_slope = None
          else:
              try:
                  slope = abs(float(raw_slope))
              except (TypeError, ValueError):
                  slope_candidate = None
                  slope_candidate_t = None
                  stable_slope = None
              else:
                  if slope != slope_candidate:
                      slope_candidate = slope
                      slope_candidate_t = t
                  if (slope_candidate_t is not None
                          and (t - slope_candidate_t) >= SLOPE_HOLD):
                      stable_slope = slope_candidate

          epb_takeover_edge = (
              s.WCBS_AVH_Status == "AVH Active"
              and s.EPB_Sts in ("Locking", "Locked")
              and s.prev.EPB_Sts in (None, "Unknown", "Released")
          )
          if not epb_takeover_edge:
              return "MONITORING"

          context = ("EPB=%s、AVH=%s、车速=%s km/h、静止=%s、主缸=%s bar"
                     % (s.EPB_Sts, s.WCBS_AVH_Status, s.WCBS_VehicleSpeed,
                        s.ESC_VehicleStandstill, s.WCBS_MainCylinderPress))
          if stable_slope is None:
              attempt("AVH Active 期间检出 EPB 接管，但坡度未稳定满 %.1fs" % SLOPE_HOLD)
              reason("接管边沿证据不足：ESC_SlopeGrade=%s，%s；不做 25%% 阈值判决"
                     % (raw_slope, context))
              return "SLOPE_NOT_STABLE"

          if stable_slope < TAKEOVER_SLOPE:
              attempt("EPB 在 %.1f%% 坡度接管 AVH（要求 >=%.1f%%）"
                      % (stable_slope, TAKEOVER_SLOPE))
              reason("检出低于阈值的 EPB 接管：稳定绝对坡度 %.1f%% < %.1f%%，%s"
                     % (stable_slope, TAKEOVER_SLOPE, context))
              return "BELOW_THRESHOLD"

          reason("EPB 在稳定绝对坡度 %.1f%% 接管 AVH，满足 >=%.1f%% 的功能定义；%s"
                 % (stable_slope, TAKEOVER_SLOPE, context))
          return "EXPECTED_THRESHOLD"
